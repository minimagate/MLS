[workspace]
members = ["crates/mls-core", "crates/mls-tm", "crates/mls-sir", "crates/mls-models", "crates/mls-lean", "crates/mls-cli"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.99"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[workspace.lints.clippy]
all = "deny"
